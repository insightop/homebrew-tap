name: Update Casks

# 统一入口：每天检测所有第三方 cask 是否有新版，有则开 PR。
#
# 每个 cask 是一个独立 job（而非 matrix），好处：
#   - 单个失败不影响其它；可在 Actions 页面单独重跑
#   - 手动触发时只跑选中的那个，不会为其余 cask 启动空 job 白等 runner
#   - 每个 job 可用各自的 runner（见下）
#
# runner 分配原则：能做到的用 ubuntu，有平台限制的才用 macos。
#   pixso                                    → ubuntu-latest（纯 Ruby，不读 dmg）
#   读 dmg 的三个（mimo / xianyu / deepseek）→ ubuntu-26.04（镜像自带 7zip 26.00；
#     读 APFS 需 >= 22.00、读 XZ(ULMO) 压缩的 dmg 需 >= 24.01，而 ubuntu-latest 现为 24.04，只带 23.01）
#   boya                                     → macos-latest（签名/公证校验依赖 pkgutil、spctl，macOS 专有）
# 本仓库为 public，两类标准 runner 均免费。
#
# 读 dmg 的三个 job 钉死 ubuntu-26.04（README 亦建议钉具体版本），避免 `-latest`
# 迁移时被静默换镜像；待 ubuntu-latest 升到 26.04 后可改回，也可继续钉着。
#
# 注意：schedule 触发时 github.event.inputs 为 null，故条件里显式判断
# github.event_name == 'schedule'；否则 null == 'all' 为 false，定时任务会被全部跳过。

on:
  schedule:
    # 每天 00:00 UTC（北京时间 08:00）检测一次
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      cask:
        description: 要检测的 cask（all = 全部）
        required: true
        type: choice
        default: all
        options:
          - all
          - boya-central
          - deepseek-harness
          - mimo-desktop
          - pixso
          - xianyu-seller-im

permissions:
  contents: write
  pull-requests: write

# 避免上一次运行未结束时重复开跑
concurrency:
  group: update-casks
  cancel-in-progress: false

jobs:
  pixso:
    # 纯 Ruby，无需 macOS 命令
    if: ${{ github.event_name == 'schedule' || github.event.inputs.cask == 'all' || github.event.inputs.cask == 'pixso' }}
    uses: ./.github/workflows/update-cask.yml
    with:
      cask: pixso
      script: scripts/update-pixso.rb
      file: Casks/pixso.rb
      runner: ubuntu-latest
      source: 官方 electron-updater 通道 `api.pixso.cn/api/upgrade/desktop/bosyun/latest-mac.yml`
      extra: 已用官方 sha512 校验安装包完整性

  mimo-desktop:
    # 需 7-Zip 读 dmg（校验包内版本；版本来自官方 manifest.json）
    if: ${{ github.event_name == 'schedule' || github.event.inputs.cask == 'all' || github.event.inputs.cask == 'mimo-desktop' }}
    uses: ./.github/workflows/update-cask.yml
    with:
      cask: mimo-desktop
      script: scripts/update-mimo.rb
      file: Casks/mimo-desktop.rb
      runner: ubuntu-26.04
      source: 官方发布清单 `mimocode-cdn.xiaomimimo.com/mimocode/mimodesktop/manifest.json`
      extra: 已用清单自带的官方 sha256 校验，并核对包内 App 版本

  xianyu-seller-im:
    # 需 7-Zip 读 APFS dmg
    if: ${{ github.event_name == 'schedule' || github.event.inputs.cask == 'all' || github.event.inputs.cask == 'xianyu-seller-im' }}
    uses: ./.github/workflows/update-cask.yml
    with:
      cask: xianyu-seller-im
      script: scripts/update-xianyu.rb
      file: Casks/xianyu-seller-im.rb
      runner: ubuntu-26.04
      source: 官方 OSS 分发目录的文件名探测（该 App 无版本清单/更新接口）
      extra: 已核对包内 App 版本（mac 与 win 包需成对存在才认定为正式发布）

  deepseek-harness:
    # 需 7-Zip 读 dmg（校验包内版本；版本来自官方 electron-updater feed）
    # 注意：官方目前只有 nightly channel（RC 阶段），版本可能频繁变动
    if: ${{ github.event_name == 'schedule' || github.event.inputs.cask == 'all' || github.event.inputs.cask == 'deepseek-harness' }}
    uses: ./.github/workflows/update-cask.yml
    with:
      cask: deepseek-harness
      script: scripts/update-deepseek.rb
      file: Casks/deepseek-harness.rb
      runner: ubuntu-26.04
      source: 官方 electron-updater feed `download.deepseek.com/dsh-desk/feeds/mac-arm64/nightly-mac.yml`
      extra: dmg 由 feed 版本号构造（feed 只提供 .zip），已自算 sha256 并核对包内 App 版本

  boya-central:
    # 必须 macOS：pkg 签名与公证校验依赖 pkgutil / spctl（macOS 专有）
    if: ${{ github.event_name == 'schedule' || github.event.inputs.cask == 'all' || github.event.inputs.cask == 'boya-central' }}
    uses: ./.github/workflows/update-cask.yml
    with:
      cask: boya-central
      script: scripts/update-boya.rb
      file: Casks/boya-central.rb
      runner: macos-latest
      source: 官网下载页 https://www.boyamic.com/support/download
      extra: 已校验 Apple 签名与公证，并核对包内 App 版本
