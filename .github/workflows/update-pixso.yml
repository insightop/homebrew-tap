name: Update Pixso

on:
  schedule:
    # 每周一凌晨 4:00 UTC（北京时间周一 12:00）检测一次
    - cron: "0 4 * * 1"
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write
  pull-requests: write

jobs:
  update-pixso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect & update
        id: detect
        # 脚本自身决定是否下载；仅在有新版时修改 Casks/pixso.rb
        # 需要下载 268MB 安装包，使用官方 sha512 校验完整性
        run: |
          out="$(ruby scripts/update-pixso.rb)"
          ver="$(printf '%s\n' "$out" | sed -n 's/^new_version=//p')"
          echo "new_version=$ver" >> "$GITHUB_OUTPUT"
          if git diff --quiet --exit-code Casks/pixso.rb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if no update
        if: steps.detect.outputs.changed != 'true'
        run: echo "已是最新版本，无需更新"; exit 0

      - name: Commit & open PR
        if: steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ steps.detect.outputs.new_version }}
          BRANCH: ci/pixso-${{ steps.detect.outputs.new_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          branch="ci/pixso-${NEW_VERSION}"
          # 分支已存在（上次运行留下的未合并 PR）则复用，否则新建；均指向最新 main + 本次改动
          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null 2>&1; then
            git checkout -B "$branch" origin/main
          else
            git checkout -b "$branch" origin/main
          fi
          git add Casks/pixso.rb
          git commit -m "chore: update pixso to ${NEW_VERSION}"
          git push --force-with-lease origin "$branch"

          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            echo "PR already exists, skip"
          else
            sed "s/__VERSION__/${NEW_VERSION}/" .github/update-pixso-pr.md > /tmp/pr-body.md
            gh pr create \
              --title "chore: update pixso to ${NEW_VERSION}" \
              --body-file /tmp/pr-body.md \
              --base main \
              --head "$branch"
          fi
