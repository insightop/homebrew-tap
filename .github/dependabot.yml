version: 2
updates:
  # GitHub Actions：跟进 .github/workflows 与 .github/actions 里的 action 版本
  # （如 actions/checkout、ruby/setup-ruby），避免重演 Node 20 废弃这类滞后问题。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    # 同一周内多个 action 的更新合并为一个 PR，减少噪音
    groups:
      github-actions:
        patterns:
          - "*"
